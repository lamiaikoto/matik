<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#1E293B" stroke-width="8"/>
  
  <!-- Subtle inner glow ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Brand Symbol 'M' with dynamic modern architecture -->
  <g filter="url(#shadow)">
    <path d="M 120 380 L 120 152 C 120 144 128 138 136 142 L 256 268 L 376 142 C 384 138 392 144 392 152 L 392 380 C 392 388 384 394 376 394 L 336 394 C 328 394 322 388 322 380 L 322 250 L 268 306 C 262 312 250 312 244 306 L 190 250 L 190 380 C 190 388 184 394 176 394 L 136 394 C 128 394 120 388 120 380 Z" fill="url(#gold)" />
  </g>

  <!-- Security dot / pulse representing the Stripe caution hold -->
  <circle cx="392" cy="144" r="28" fill="#10B981" stroke="#0F172A" stroke-width="6"/>
  <path d="M 382 144 L 389 151 L 404 136" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
